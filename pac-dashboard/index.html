    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Devo collegare il conto del broker?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ETF Lens non ha accesso ai tuoi broker. Inserisci manualmente gli acquisti, o importa un CSV esportato dal broker (anche via AI)."
          }
        },
        {
          "@type": "Question",
          "name": "I miei dati sono al sicuro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì. Autenticazione Supabase, dati cifrati a riposo. Puoi esportare tutto in JSON in qualsiasi momento ed eliminare l'account."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto costa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Il piano Free è gratuito e copre la maggior parte dei casi (fino a 9 ETF attivi, 5 broker, 100 acquisti). Il piano Pro costa €4,99/mese e rimuove tutti i limiti. Oppure puoi self-hostare: il codice è open source MIT su GitHub."
          }
        },
        {
          "@type": "Question",
          "name": "Come funziona la connessione AI (MCP)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aggiungi l'URL del server MCP nel tuo client AI — il client gestisce l'autenticazione in automatico tramite OAuth 2.1 con PKCE (ti viene chiesto il consenso una sola volta). In alternativa puoi usare una API key manuale dalle Impostazioni. L'AI interroga solo il tuo portafoglio."
          }
        },
        {
          "@type": "Question",
          "name": "Da dove arrivano i prezzi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Da ExtraETF — stessi dati dei principali portali ETF europei. Puoi sempre sovrascrivere manualmente."
          }
        },
        {
          "@type": "Question",
          "name": "Funziona con broker italiani?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, qualsiasi broker: Fineco, Directa, Unicredit, Sella, Degiro, IBKR, Trade Republic. Ne gestisci quanti vuoi in parallelo."
          }
        }
      ]
    }
    </script>
